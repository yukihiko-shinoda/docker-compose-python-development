services:
  python-development:
    build:
      args:
        # - Cloud SDK release notes  |  Google Cloud CLI Documentation
        #   https://cloud.google.com/sdk/docs/release-notes
        GCLOUD_VERSION: 584.0.0
        # - Releases · googleworkspace/cli
        #   https://github.com/googleworkspace/cli/releases
        GWS_VERSION: 0.22.5
      context: .
    image: futureys/claude-code-python-development:google-drive
    secrets:
      # Mounted at /opt/claude-agent-secrets/, not the default /run/secrets/,
      # so git-agent-credential-helper.sh (see Dockerfile) can read it from
      # inside Claude Code's own Bash sandbox, which keeps /run/secrets
      # denied but allow-lists /opt/claude-agent-secrets/*.
      - source: git_auth_secret
        target: /opt/claude-agent-secrets/git_auth_token
      - source: slack_webhook_url
      # Static claude-code service account key, minted on the host by
      # gcp-agent-key.sh into ~/.gcp-agent-secrets/ -- placed in the same
      # container directory as the AWS secrets above so Claude Code's own
      # Bash sandbox, which already denies reading /opt/claude-agent-secrets
      # except for the three AWS files explicitly allow-listed there, denies
      # this file too without any sandbox config change.
      - source: gcp_claude_code_key
        target: /opt/claude-agent-secrets/claude-code-key.json
    # Claude Code's built-in Bash sandbox uses bubblewrap, which needs the unshare/mount/
    # pivot_root syscalls to build its sandbox -- Docker's default seccomp filter blocks
    # those, so it's removed here. CAP_SYS_ADMIN was also added alongside this at first
    # (containers/bubblewrap#505 reports it as commonly needed too), but this host's
    # kernel allows unprivileged user namespaces without it, so it was dropped once that
    # was confirmed working:
    # https://github.com/containers/bubblewrap/issues/505
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/workspace:cached
      - venvs:/workspace/venvs
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      # - Using uv in Docker | uv
      #   https://docs.astral.sh/uv/guides/integration/docker/#caching
      - uv-cache:/root/.cache/uv
      - uv-python:/root/.local/share/uv/python
volumes:
  uv-cache:
  venvs:
  uv-python:
secrets:
  git_auth_secret:
    environment: GIT_AUTH_TOKEN
  slack_webhook_url:
    environment: SLACK_WEBHOOK_URL
  gcp_claude_code_key:
    file: ${HOME}/.gcp-agent-secrets/claude-code-key.json
