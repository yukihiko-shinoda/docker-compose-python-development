

services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  python-development:
    # Uncomment if you want to override the service's Dockerfile to one in the .devcontainer 
    # folder. Note that the path of the Dockerfile and context is relative to the *primary* 
    # docker-compose.yml file (the first in the devcontainer.json "dockerComposeFile"
    # array). The sample below assumes your primary file is in the root of your project.
    #
    # build:
    #   context: .
    #   dockerfile: .devcontainer/Dockerfile
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    image: futureys/claude-code-python-development:20261122183500
    secrets:
      # Mounted at the default /run/secrets/<source>, which Claude Code's own
      # Bash sandbox denies reading: only processes outside the sandbox (e.g.
      # the base image's git-agent-credential-helper and hookbell) use them.
      - source: GIT_AUTH_TOKEN
      - source: slack_webhook_url
      - source: slack_bot_token
      - source: hookbell_slack_channel_id
      - source: hookbell_slack_allowed_user_id
      # Static claude-code service account key, minted on the host by
      # gcp-agent-key.sh into ~/.gcp-agent-secrets/. Mounted at the path the
      # base image's gws wrapper (/usr/local/bin/gws) reads it from, instead
      # of under /run/secrets/. Since that wrapper runs inside Claude Code's
      # Bash sandbox, this key is readable from there too, so its blast radius
      # depends on what the service account is granted: users should share only
      # the specific Google Drive folders Claude Code needs with it, and grant
      # it no project-level IAM roles.
      - source: gcp_claude_code_key
        target: /opt/claude-agent-secrets/claude-code-key.json
    # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
    # cap_add:
    #   - SYS_PTRACE
    # Claude Code's built-in Bash sandbox uses bubblewrap, which needs the unshare/mount/
    # pivot_root syscalls to build its sandbox -- Docker's default seccomp filter blocks
    # those, so it's removed here. CAP_SYS_ADMIN was also added alongside this at first
    # (containers/bubblewrap#505 reports it as commonly needed too), but this host's
    # kernel allows unprivileged user namespaces without it, so it was dropped once that
    # was confirmed working:
    # https://github.com/containers/bubblewrap/issues/505
    security_opt:
      - seccomp:unconfined
    tmpfs:
      - /root/.config/gh
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/workspace:cached
      - venvs:/workspace/venvs
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
      # - Using uv in Docker | uv
      #   https://docs.astral.sh/uv/guides/integration/docker/#caching
      - uv-cache:/root/.cache/uv
      - uv-python:/root/.local/share/uv/python
volumes:
  uv-cache:
  venvs:
  uv-python:
secrets:
  GIT_AUTH_TOKEN:
    environment: GIT_AUTH_TOKEN
  slack_webhook_url:
    environment: SLACK_WEBHOOK_URL
  slack_bot_token:
    environment: SLACK_BOT_TOKEN
  hookbell_slack_channel_id:
    environment: HOOKBELL_SLACK_CHANNEL_ID
  hookbell_slack_allowed_user_id:
    environment: HOOKBELL_SLACK_ALLOWED_USER_ID
  gcp_claude_code_key:
    file: ${HOME}/.gcp-agent-secrets/claude-code-key.json
